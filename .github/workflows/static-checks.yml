name: M03 static checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml pillow -e .
      - name: Shell syntax and shellcheck
        run: |
          set -euo pipefail
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -S style
      - name: Validate workflow YAML and Compose (dummy secrets, no real values)
        run: |
          set -euo pipefail
          T=$(mktemp -d); mkdir "$T/sec"
          for f in postgres_password paperless_secret_key paperless_admin_password; do echo dummy > "$T/sec/$f"; done
          cp compose/paperless-gpt.env.example "$T/sec/paperless-gpt.env"
          cp compose/paperless.env.example compose/paperless.env
          cp compose/.env.example compose/.env
          sed "s#/etc/atlas/secrets/module03-sandbox#$T/sec#g" compose/docker-compose.yml > "$T/docker-compose.yml"
          cp compose/paperless.env "$T/"; cp compose/.env "$T/"
          (cd "$T" && docker compose --profile ai config -q && docker compose --profile ai config --images)
          rm -f compose/paperless.env compose/.env
          python - <<'PYCODE'
          from pathlib import Path
          import yaml
          for path in list(Path('.github/workflows').glob('*.yml')) + list(Path('compose').glob('*.yml')):
              yaml.safe_load(path.read_text()); print('YAML OK:', path)
          PYCODE
      - name: Secret scan (tracked files)
        run: python -m pytest -q tests/unit/test_repo_static.py -k "secret or private or placeholders"
      - name: Unit tests (registry, library-read, library-ingest, repo invariants)
        run: python -m pytest -q
  # Echte Container-Tests auf dem (isolierten, flüchtigen) Runner. Keine Secrets nötig: Wegwerf-Secrets im Temp-Verzeichnis,
  # ausschließlich synthetische Daten, Bindung nur an 127.0.0.1.
  core-integration:
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Core smoke test (Paperless 3.3.0 + PostgreSQL 18 + Valkey 9)
        run: sudo -E env "PATH=$PATH" bash tests/integration/core-smoke.sh
  e2e:
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml pillow -e .
      - name: E2E gegen echtes Paperless (Taxonomie, T01-T14, library-read/-ingest HTTP+MCP)
        run: sudo -E env "PATH=$PATH" bash tests/integration/run-e2e.sh
      - name: Paperless-GPT Start-/Verbindungstest (ohne LLM; Funktionstest BLOCKED)
        run: sudo -E env "PATH=$PATH" bash tests/integration/gpt-smoke.sh
  restore-e2e:
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow -e .
      - name: Backup -> Destroy -> Restore (nur im flüchtigen Runner; Guards in der Skriptdatei)
        run: sudo -E env "PATH=$PATH" M03_ISOLATED_TEST_ENV=1 bash tests/integration/restore-e2e.sh
